# The Flathub manifest (owner, 2026-10-01: Linux on Flathub, app source stays private). Flathub builds
# the Flatpak from the published Linux app folder (keep-the-diff-<version>-linux-x86_64.tar.gz on
# dl.keepthediff.com), so no source is needed. At each release the url and sha256 below are updated to
# that release's tarball, and the file is copied into the Flathub repository for this app id.
app-id: com.keepthediff.KeepTheDiff
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: keep-the-diff
finish-args:
  - --share=network        # sign-in, sync and Premium checks with keepthediff.com
  - --share=ipc
  - --socket=x11           # Compose Desktop draws through AWT, which uses X11 (XWayland on Wayland)
  - --device=dri
modules:
  - name: keep-the-diff
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib
      - cp -a keep-the-diff /app/lib/keep-the-diff
      - install -Dm755 /dev/stdin /app/bin/keep-the-diff <<< 'exec /app/lib/keep-the-diff/bin/keep-the-diff "$@"'
      - install -Dm644 com.keepthediff.KeepTheDiff.desktop /app/share/applications/com.keepthediff.KeepTheDiff.desktop
      - install -Dm644 com.keepthediff.KeepTheDiff.metainfo.xml /app/share/metainfo/com.keepthediff.KeepTheDiff.metainfo.xml
      - install -Dm644 keep-the-diff/lib/keep-the-diff.png /app/share/icons/hicolor/512x512/apps/com.keepthediff.KeepTheDiff.png
    sources:
      - type: archive
        # Set at release: https://dl.keepthediff.com/linux/<sha>/keep-the-diff-<version>-linux-x86_64.tar.gz
        url: https://dl.keepthediff.com/linux/5e6884c1d839b3a8eac0b3135dd695f362a82f97/keep-the-diff-1.2.8-linux-x86_64.tar.gz
        sha256: e3b3ccd3a3daaa075e9f34f2ad8d0970b7d67d12df5ccaf797eec272f60cbe61
        dest: keep-the-diff
        strip-components: 1
      - type: file
        path: com.keepthediff.KeepTheDiff.desktop
      - type: file
        path: com.keepthediff.KeepTheDiff.metainfo.xml
