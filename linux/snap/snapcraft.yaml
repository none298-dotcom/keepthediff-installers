name: keep-the-diff
base: core22
version: "VERSION"
title: "Keep the Diff: Save Money"
summary: Save money by logging what you didn't buy. No budget, no bank.
description: |
  Keep the Diff is a savings tracker built around one subtraction: what you were ready to spend,
  minus what you actually spent. The difference is your Diff, and it adds up week by week toward
  the things you are saving for.

  Use it for a no spend challenge, a no buy year or a low buy month, or simply to see how much
  your better decisions add up to. A slip never resets your total, and there is no streak to lose.

  - Log a Diff in seconds: what you planned to spend and what you spent
  - Running totals by week, by month and across the year
  - Savings goals with a photo, including a 52 week savings challenge
  - "Not sure yet": park a purchase and decide later
  - No budget to follow, no bank connection, no account needed, no ads

  Logging is free. Premium adds end-to-end encrypted sync across your devices, full history,
  CSV export, categories, unlimited goals, widgets and App Lock.
grade: stable
confinement: strict
license: Proprietary
website: https://keepthediff.com
contact: https://keepthediff.com/contact
issues: https://keepthediff.com/contact
icon: snap/gui/keep-the-diff.png

apps:
  keep-the-diff:
    command: bin/keep-the-diff
    extensions: [gnome]
    plugs: [network, home, opengl, desktop, desktop-legacy, x11, wayland]

parts:
  app:
    plugin: dump
    source: app.tar.gz
