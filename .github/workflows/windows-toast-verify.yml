name: Verify the Windows feedback push toast

# The feedback push (KtdNotify.exe, android/desktop/windows-notify) posts one Windows toast whose link is
# keepthediff://feedback. The EXE workflow's runner is Windows SERVER, which has no notification platform
# (CreateToastNotifier fails with 0x80070490 there), so the toast is proven here, on a Windows 11 client
# runner, the same one the widget board is proven on.
#
# What this proves: the helper builds, posts a toast that Windows accepts, the toast sits in the Action Center
# history with activationType="protocol" and the feedback link, and a link of that shape is routed by the
# per-user keepthediff:// handler (registered with the same three reg commands WindowsTaskScheduler.kt runs) to
# a program we control, which records what it was handed. The installed app's own --open handling is not part
# of this; the app's tests cover it. What it cannot do is click the banner with a mouse.

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch or commit sha of keepthediff to verify"
        default: "main"

permissions:
  contents: read

jobs:
  # The private source cannot be checked out over ssh on the ARM runner, so the helper is built where it can be
  # (a stock runner) and handed over as an artifact. It is an x64 program; Windows 11 on ARM runs it emulated.
  build:
    runs-on: windows-latest
    env:
      SOURCE_REF: ${{ inputs.source_ref || 'main' }}
    steps:
      - name: Check out the private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: none298-dotcom/keepthediff
          ref: ${{ env.SOURCE_REF }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"

      - name: Build the push helper
        shell: pwsh
        run: |
          ./android/desktop/windows-notify/build.ps1 -OutDir "$env:RUNNER_TEMP\notify-build"
          "keepthediff @ $(git rev-parse HEAD)" | Out-File "$env:RUNNER_TEMP\notify-build\notify\provenance.txt"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: notify-helper
          path: ${{ runner.temp }}\notify-build\notify

  verify:
    needs: build
    runs-on: windows-11-arm
    env:
      OUT: ${{ github.workspace }}\toast-proof
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: notify-helper
          path: ${{ runner.temp }}\notify-build\notify

      - name: Make the proof folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:OUT | Out-Null
          Copy-Item "$env:RUNNER_TEMP\notify-build\notify\provenance.txt" $env:OUT -EA SilentlyContinue

      # Register the handler FIRST: the toast's link is activated by a real mouse click on the banner, and Windows
      # hands it to whatever keepthediff:// is registered to. A stand-in for the app records what it is handed. The
      # three reg commands are the ones WindowsTaskScheduler.registerProtocol runs, with the stand-in in place of the app.
      - name: Post the toast, click the banner, and see the link arrive
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          Add-Type -Name Mouse -Namespace Ktd -MemberDefinition '[DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y); [DllImport("user32.dll")] public static extern void mouse_event(uint f, uint dx, uint dy, uint d, System.IntPtr e);'
          $rec = "$env:OUT\handler-args.txt"
          $stand = "$env:OUT\handler.cmd"
          Set-Content $stand "@echo %* > `"$rec`""
          $key = "HKCU\Software\Classes\keepthediff"
          reg add $key /ve /d "URL:Keep the Diff" /f | Out-Null
          reg add $key /v "URL Protocol" /d "" /f | Out-Null
          reg add "$key\shell\open\command" /ve /d "`"$stand`" --open `"%1`"" /f | Out-Null

          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          function Grab { $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height; [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size); $bmp }
          [Ktd.Mouse]::SetCursorPos(5, 5) | Out-Null
          Start-Sleep 2
          $before = Grab; $before.Save("$env:OUT\desktop-before.png")

          $helper = "$env:RUNNER_TEMP\notify-build\notify\KtdNotify.exe"
          $fire = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
          Start-Process -FilePath $helper -ArgumentList @(
            "--post", "--fire-ms", "$fire", "--task", "ktd-ci-none",
            "--title", "Please share your feedback",
            "--body", "Anything too complicated about Keep the Diff? I'd love to hear your feedback. Cheers -Lee",
            "--url", "keepthediff://feedback", "--app", "unused") | Out-Null
          Start-Sleep -Milliseconds 1800
          $after = Grab; $after.Save("$env:OUT\desktop-toast.png")
          $log = "$env:LOCALAPPDATA\KeepTheDiff\notify.log"
          if (Test-Path $log) { Write-Host "--- notify.log ---"; Get-Content $log | Write-Host; Copy-Item $log "$env:OUT\notify.log" }

          # The toast lives in the bottom right corner. Find the pixels that changed there.
          $minX = 99999; $minY = 99999; $maxX = -1; $maxY = -1; $n = 0
          for ($y = [int]($b.Height * 0.55); $y -lt $b.Height - 48; $y += 2) {
            for ($x = [int]($b.Width * 0.55); $x -lt $b.Width; $x += 2) {
              $p = $before.GetPixel($x, $y); $q = $after.GetPixel($x, $y)
              if ([Math]::Abs($p.R-$q.R) -gt 30 -or [Math]::Abs($p.G-$q.G) -gt 30 -or [Math]::Abs($p.B-$q.B) -gt 30) {
                $n++; if ($x -lt $minX) { $minX = $x }; if ($x -gt $maxX) { $maxX = $x }; if ($y -lt $minY) { $minY = $y }; if ($y -gt $maxY) { $maxY = $y }
              }
            }
          }
          Write-Host "changed pixels in the corner: $n, box ($minX,$minY)-($maxX,$maxY)"
          if ($n -lt 400 -or ($maxX - $minX) -lt 150 -or ($maxY - $minY) -lt 40) { Write-Host "::error::No toast banner appeared in the corner of the screen. See desktop-toast.png and notify.log."; exit 1 }
          Write-Host "a toast banner is on screen"

          $cx = [int](($minX + $maxX) / 2); $cy = [int](($minY + $maxY) / 2)
          [Ktd.Mouse]::SetCursorPos($cx, $cy) | Out-Null; Start-Sleep -Milliseconds 300
          [Ktd.Mouse]::mouse_event(0x0002, 0, 0, 0, [IntPtr]::Zero); Start-Sleep -Milliseconds 80; [Ktd.Mouse]::mouse_event(0x0004, 0, 0, 0, [IntPtr]::Zero)
          $seen = $false
          for ($i = 0; $i -lt 20 -and -not $seen; $i++) { Start-Sleep 1; $seen = Test-Path $rec }
          if (-not $seen) { Write-Host "::error::Clicking the banner did not hand keepthediff://feedback to the registered handler."; exit 1 }
          $got = (Get-Content $rec -Raw).Trim()
          Write-Host "handler was given: $got"
          if ($got -notmatch "--open" -or $got -notmatch "keepthediff://feedback") { Write-Host "::error::The handler was not given --open and the feedback link."; exit 1 }
          Write-Host "clicking the banner opened keepthediff://feedback"

      - name: Screenshot the desktop
        if: always()
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$env:OUT\desktop.png")

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: windows-toast-proof
          path: ${{ env.OUT }}
