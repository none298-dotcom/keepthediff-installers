name: Verify the Windows feedback push toast

# The feedback push (KtdNotify.exe, android/desktop/windows-notify) posts one Windows toast whose link is
# keepthediff://feedback. The EXE workflow's runner is Windows SERVER, which has no notification platform
# (CreateToastNotifier fails with 0x80070490 there), so the toast is proven here, on a Windows 11 client
# runner, the same one the widget board is proven on.
#
# What this proves: the helper builds, posts a toast that Windows accepts, the toast sits in the Action Center
# history with activationType="protocol" and the feedback link, and a link of that shape is routed by the
# per-user keepthediff:// handler (registered with the same three reg commands WindowsTaskScheduler.kt runs) to
# a program we control, which records what it was handed. The installed app's own --open handling is not part
# of this; the app's tests cover it. What it cannot do is click the banner with a mouse.

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch or commit sha of keepthediff to verify"
        default: "main"

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-11-arm
    env:
      SOURCE_REF: ${{ inputs.source_ref || 'main' }}
      OUT: ${{ github.workspace }}\toast-proof
    steps:
      - name: Check out the private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: none298-dotcom/keepthediff
          ref: ${{ env.SOURCE_REF }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"

      - name: Build the push helper
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:OUT | Out-Null
          ./android/desktop/windows-notify/build.ps1 -OutDir "$env:RUNNER_TEMP\notify-build"
          "keepthediff @ $(git rev-parse HEAD)" | Out-File "$env:OUT\provenance.txt"

      - name: Post the toast and read it back from the Action Center
        shell: powershell
        run: |
          $helper = "$env:RUNNER_TEMP\notify-build\notify\KtdNotify.exe"
          $url = "keepthediff://feedback"
          $fire = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
          $p = Start-Process -FilePath $helper -PassThru -Wait -ArgumentList @(
            "--post", "--fire-ms", "$fire", "--task", "ktd-ci-none",
            "--title", "Please share your feedback",
            "--body", "Anything too complicated about Keep the Diff? I'd love to hear your feedback. Cheers -Lee",
            "--url", $url, "--app", "unused")
          Write-Host "helper exited with $($p.ExitCode)"
          $log = "$env:LOCALAPPDATA\KeepTheDiff\notify.log"
          if (Test-Path $log) { Write-Host "--- notify.log ---"; Get-Content $log | Write-Host; Copy-Item $log "$env:OUT\notify.log" }
          [void][Windows.UI.Notifications.ToastNotificationManager, Windows.UI.Notifications, ContentType = WindowsRuntime]
          $aumid = "LittleBirdTradingLLC.KeepTheDiff"
          $found = $null
          for ($i = 0; $i -lt 10 -and -not $found; $i++) {
            $found = [Windows.UI.Notifications.ToastNotificationManager]::History.GetHistory($aumid) |
                     Where-Object { $_.Content.GetXml() -match "Please share your feedback" } | Select-Object -First 1
            if (-not $found) { Start-Sleep 1 }
          }
          if (-not $found) { Write-Host "::error::No toast reached the Action Center history. See notify.log above."; exit 1 }
          $xml = $found.Content.GetXml()
          $xml | Out-File "$env:OUT\toast.xml"
          Write-Host $xml
          if ($xml -notmatch 'activationType="protocol"' -or $xml -notmatch [regex]::Escape($url)) { Write-Host "::error::The toast does not carry the protocol launch URL."; exit 1 }
          Write-Host "toast is in the Action Center with the feedback link"

      - name: Route the toast's link through the per-user keepthediff:// handler
        shell: powershell
        run: |
          # A stand-in for the app: records the arguments it is handed. The three reg commands are the ones
          # WindowsTaskScheduler.registerProtocol runs, with the stand-in in place of the app.
          $rec = "$env:OUT\handler-args.txt"
          $stand = "$env:OUT\handler.cmd"
          Set-Content $stand "@echo %* > `"$rec`""
          $key = "HKCU\Software\Classes\keepthediff"
          reg add $key /ve /d "URL:Keep the Diff" /f | Out-Null
          reg add $key /v "URL Protocol" /d "" /f | Out-Null
          reg add "$key\shell\open\command" /ve /d "`"$stand`" --open `"%1`"" /f | Out-Null
          Start-Process "keepthediff://feedback"
          $seen = $false
          for ($i = 0; $i -lt 20 -and -not $seen; $i++) { Start-Sleep 1; $seen = Test-Path $rec }
          if (-not $seen) { Write-Host "::error::Windows did not hand keepthediff://feedback to the registered handler."; exit 1 }
          $got = (Get-Content $rec -Raw).Trim()
          Write-Host "handler was given: $got"
          if ($got -notmatch "--open" -or $got -notmatch "keepthediff://feedback") { Write-Host "::error::The handler was not given --open and the feedback link."; exit 1 }

      - name: Screenshot the desktop
        if: always()
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$env:OUT\desktop.png")

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: windows-toast-proof
          path: ${{ env.OUT }}
