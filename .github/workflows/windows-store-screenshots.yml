name: Windows store screenshots

# Captures the desktop app ON WINDOWS for the Microsoft Store listing.
#
# WHY IT LIVES HERE AND NOT IN THE SOURCE REPO
# The first attempt put this workflow in the private source repo and every job died in three
# seconds, before a runner was assigned:
#
#   "The job was not started because recent account payments have failed or your spending limit
#    needs to be increased."
#
# Actions is free on public repos and metered on private ones. windows-exe-verify.yml already
# records this and AGENTS.md already states the rule; it was ignored anyway, and re-learned the
# same way. Source is fetched into the ephemeral workspace with the read-only deploy key and never
# lands in this repo.
#
# WHY IT IS NOT PART OF windows-exe-verify.yml
# That workflow builds, signs and installs the packaged EXE, which is the right shape for proving a
# build certifies and far too heavy for taking pictures. This runs the app straight from Gradle and
# screenshots the WINDOW rather than the whole desktop: a listing image must be the app, not the
# app on a runner's blank wallpaper.

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch or sha of the source repo to capture
        required: false
        default: main

jobs:
  capture:
    runs-on: windows-latest
    steps:
      - name: Check out the private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: none298-dotcom/keepthediff
          ref: ${{ inputs.source_ref }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}

      # 17, not 21. `android/desktop/build.gradle.kts` declares `jvmToolchain(17)`, and Gradle will
      # not silently fall back to a newer JDK: it fails with "Cannot find a Java installation on your
      # machine matching languageVersion=17", which reads like a runner problem and is a version
      # mismatch. windows-exe-verify.yml builds the same module and already uses 17.
      - name: Setup JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      # Runners come up at 1024x768, which is BELOW the Microsoft Store's own 1366x768 floor for a
      # listing image. Captured at the default, every screenshot this job produced would be rejected
      # for being too small, and the app's window would also be taller than the screen it is drawn
      # on. windows-exe-verify.yml hit the same thing: its first capture showed a window whose
      # primary button was simply below the bottom of the display.
      - name: Give the runner a display the window fits on
        continue-on-error: true
        shell: pwsh
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force } catch { Write-Host "::warning::Set-DisplayResolution failed: $_" }
          Add-Type -AssemblyName System.Windows.Forms
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          Write-Host "display is now $($b.Width)x$($b.Height)"

      - name: Record which commit is being captured
        shell: pwsh
        run: |
          # Provenance. A listing image from an unknown commit proves nothing about what shipped.
          $sha = git rev-parse HEAD
          Write-Host "capturing keepthediff @ $sha"
          New-Item -ItemType Directory -Force -Path shots | Out-Null
          "source_sha: $sha" | Out-File shots/provenance.txt

      - name: Seed a realistic ledger
        shell: pwsh
        run: |
          # The app opens on whatever is in its own AppData folder, and an empty one screenshots as
          # the first-run empty state: honest, and useless for a store listing.
          #
          # The seed is committed in the source repo rather than generated, because the Swift seeder
          # does not run here and the two platforms persist different JSON anyway.
          # THE SEED IS REFRESHED HERE, NOT BY WHOEVER REMEMBERS. windows-state.json carries
          # absolute dates, so it ages out of "this week" and Home screenshots as $0 with no
          # countdown: a money app's store listing showing zero. `refresh_windows_seed.py` exists
          # for exactly this and its docstring says to run it before dispatching, which is a step
          # that gets skipped. It runs here instead, against the checked out source, so a capture
          # cannot be taken from a stale seed again. It only shifts the rows; it invents nothing.
          python tools/seed/refresh_windows_seed.py --apply
          $dir = Join-Path $env:LOCALAPPDATA 'KeepTheDiff'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item 'tools/seed/windows-state.json' (Join-Path $dir 'state.json') -Force
          Write-Host "seeded $dir"

          # WHERE THE WIDGET WINDOW SITS, for the capture only. It opens in the top right corner
          # the first time, and the desktop capture has to be cropped below the app window's top
          # edge, where the capture picks up a black strip of window shadow. With the widget at the
          # very top it would be cropped in half, so it is placed lower here. This is the same
          # preferences file a person writes by dragging the window; nothing in the app changes.
          $prefs = Join-Path $dir 'preferences.properties'
          "desktopWidgetX=1600" | Out-File -FilePath $prefs -Encoding ascii
          "desktopWidgetY=90"   | Out-File -FilePath $prefs -Encoding ascii -Append
          Write-Host "widget window placed at 1600,90 for the capture"

      # Build FIRST, as its own step, with its log on screen.
      #
      # The first attempt went straight to `run` with the output discarded by `Start-Process`, and
      # when no window appeared after eight minutes there was nothing to look at: the failure said
      # "window never appeared" whether the app was slow, the build was broken, or the dependency
      # graph was still downloading. Resolving the graph here means the run step starts from a warm
      # cache and any compile failure is reported as a compile failure.
      - name: Build the desktop app
        shell: pwsh
        working-directory: android
        # Same `-PdevTools=true` as the run step below. Without it here, this step compiles the
        # source set WITHOUT the premium override and the run step reuses those classes, so the
        # flag on the run alone would silently do nothing.
        run: .\gradlew.bat :desktop:classes -PdevTools=true --console=plain --no-daemon

      - name: Capture each screen
        shell: pwsh
        env:
          # Read by the devTools source set only; in any build without -PdevTools=true the class
          # that reads this does not exist.
          KTD_PREMIUM_FOR_TESTING: 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Drawing, System.Windows.Forms, UIAutomationClient

          foreach ($screen in @('home', 'goals', 'history', 'widget')) {
            Write-Host "=== $screen ==="
            # `gradlew run` blocks while the window is open, so it is started detached and killed
            # once the frame is grabbed.
            # Output goes to a file rather than nowhere, so a crashed or failed launch can be read
            # back instead of being indistinguishable from a slow one.
            $log = "$PWD\shots\gradle-$screen.log"
            # `-PdevTools=true` plus KTD_PREMIUM_FOR_TESTING is what makes Goals screenshot as a
            # PREMIUM screen. Desktop entitlement is answered by keepthediff.com, and a runner has
            # no subscription, so `checkEntitlement()` returns "not premium" and overwrites the
            # seeded flag before the first frame -- the Goals capture came out showing the free
            # tier's single goal behind a paywall rather than the three the seed contains.
            #
            # The flag selects a source set rather than branching at runtime: without it the
            # override does not exist in the compiled output at all, and it cannot be combined with
            # `-Pdistribution=store`, which fails the build outright. See the desktop module's
            # build.gradle.kts.
            $proc = Start-Process -PassThru -FilePath "$PWD\android\gradlew.bat" `
              -ArgumentList ':desktop:run', '-PdevTools=true', "--args=--screen=$screen", '--console=plain', '--no-daemon' `
              -WorkingDirectory "$PWD\android" `
              -RedirectStandardOutput $log -RedirectStandardError "$log.err"

            # Poll for the window with a deadline rather than sleeping a fixed guess. Compose
            # Desktop's first frame lands well after the JVM starts, and the first run also has to
            # resolve the whole Gradle dependency graph.
            $deadline = (Get-Date).AddMinutes(6)
            $window = $null
            while ((Get-Date) -lt $deadline -and -not $window) {
              Start-Sleep -Seconds 5
              # Matched on a NON-EMPTY title containing the app name, not on equality. A JVM window
              # can report its title late or with decoration, and an exact match silently never
              # fires while the app is sitting there perfectly visible.
              $window = Get-Process |
                Where-Object { $_.MainWindowTitle -and $_.MainWindowTitle -like '*Keep the Diff*' } |
                Select-Object -First 1
              if ($proc.HasExited) { break }
            }
            if (-not $window) {
              Write-Host "--- gradle stdout ---"; Get-Content $log -Tail 60 -EA SilentlyContinue
              Write-Host "--- gradle stderr ---"; Get-Content "$log.err" -Tail 40 -EA SilentlyContinue
              Write-Host "--- processes with windows ---"
              Get-Process | Where-Object { $_.MainWindowTitle } |
                Select-Object Id, ProcessName, MainWindowTitle | Format-Table | Out-String | Write-Host
              throw "window never appeared for '$screen' (gradle exited: $($proc.HasExited))"
            }
            # PARK THE CURSOR FIRST, because where it sits ends up in the picture.
            #
            # A headless runner starts with the pointer at the middle of the virtual screen, and
            # the middle of a 1424x891 Compose window is inside the third goal card. Compose draws
            # a hover background under it, so `goals.png` shipped to the Microsoft Store with one
            # of three identical cards greyed out for no reason a shopper could work out. It is not
            # a click and nothing is focused; the app is simply telling the truth about where the
            # mouse is.
            #
            # The top left corner is off every control and outside the window, so nothing is hovered
            # and the arrow itself is not in the captured rectangle either.
            [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point(0, 0)

            # Let the first frame settle. A capture taken the instant the window exists catches it
            # mid-layout, which looks like a broken app rather than a slow screenshot. It is also
            # long enough for the hover the line above just left to fade out of the frame.
            Start-Sleep -Seconds 8

            # THE WIDGET SHOT IS THE WHOLE DESKTOP, not the app window. The desktop widget window
            # is 260x300 and opens at the top right of the screen, so a capture of the main window's
            # own rectangle would not contain it, and 260x300 is far below the Store's floor anyway.
            # What a shopper needs to see is both windows at once, which is a screen capture.
            if ($screen -eq 'widget') {
              $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
              $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
              $g = [System.Drawing.Graphics]::FromImage($bmp)
              $g.CopyFromScreen($b.X, $b.Y, 0, 0, $bmp.Size)
              $r = $b
            } else {
            $element = [System.Windows.Automation.AutomationElement]::FromHandle($window.MainWindowHandle)
            $r = $element.Current.BoundingRectangle
            $bmp = New-Object System.Drawing.Bitmap([int]$r.Width), ([int]$r.Height)
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen([int]$r.X, [int]$r.Y, 0, 0, $bmp.Size)
            }
            $bmp.Save("$PWD\shots\$screen.png", [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
            Write-Host "captured $screen at $([int]$r.Width)x$([int]$r.Height)"

            Stop-Process -Id $window.Id -Force -ErrorAction SilentlyContinue
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 4
          }

      - name: Refuse a blank or undersized capture
        shell: pwsh
        run: |
          # A capture that is one flat colour, or smaller than the Store's 1366x768 floor, is a
          # failed run that would otherwise upload happily and be rejected at certification much
          # later, by which point nobody remembers this job ran.
          Add-Type -AssemblyName System.Drawing
          $bad = 0
          Get-ChildItem shots\*.png | ForEach-Object {
            $img = [System.Drawing.Image]::FromFile($_.FullName)
            $seen = @{}
            for ($x = 0; $x -lt $img.Width; $x += 40) {
              for ($y = 0; $y -lt $img.Height; $y += 40) { $seen[$img.GetPixel($x, $y).ToArgb()] = $true }
            }
            Write-Host "$($_.Name): $($img.Width)x$($img.Height), $($seen.Count) distinct colours"
            if ($seen.Count -lt 5) { Write-Host "::error::$($_.Name) looks blank"; $bad++ }
            # The size floor, actually asserted. The first green run of this job produced three
            # perfectly good 960x720 captures, every one of them too small for the Store, because
            # this step only counted colours while its own comment claimed to check dimensions.
            if ($img.Width -lt 1366 -or $img.Height -lt 768) {
              Write-Host "::error::$($_.Name) is $($img.Width)x$($img.Height), under the Store's 1366x768 floor"
              $bad++
            }
            $img.Dispose()
          }
          if ($bad -gt 0) { exit 1 }

      - name: Trim the runner's wallpaper off the edges
        shell: pwsh
        run: |
          # The window capture includes a few pixels outside the window's own frame -- an 8px strip
          # down the left and a row top and bottom -- which arrives as the runner's desktop
          # wallpaper along the edge of an otherwise clean listing image. Cropped identically across
          # all three so the set stays consistent; a set where one image is 8px narrower than the
          # others reads as three from one app and one from somewhere else.
          #
          # 1424x891 is comfortably above the Microsoft Store's 1366x768 floor, which is the only
          # dimension constraint that applies here.
          Add-Type -AssemblyName System.Drawing
          # The widget shot is cropped differently: it is a desktop capture, so it carries the
          # runner's own desktop icons down the left, the "Test Mode / Windows Server" watermark at
          # the bottom right and the taskbar. None of that belongs in a Store listing. The box keeps
          # both app windows and nothing else.
          $w = "$PWD\shots\widget.png"
          if (Test-Path $w) {
            $src = [System.Drawing.Image]::FromFile($w)
            $box = New-Object System.Drawing.Rectangle 50, 0, ($src.Width - 50), 945
            if ($box.Bottom -gt $src.Height -or $box.Right -gt $src.Width) {
              $src.Dispose(); throw "widget.png is $($src.Width)x$($src.Height), too small for the crop box"
            }
            $dst = New-Object System.Drawing.Bitmap $box.Width, $box.Height
            $g = [System.Drawing.Graphics]::FromImage($dst)
            $g.DrawImage($src, (New-Object System.Drawing.Rectangle 0, 0, $box.Width, $box.Height), $box, [System.Drawing.GraphicsUnit]::Pixel)
            $g.Dispose(); $src.Dispose()
            $dst.Save($w, [System.Drawing.Imaging.ImageFormat]::Png)
            Write-Host "cropped widget.png to $($box.Width)x$($box.Height)"
            $dst.Dispose()
          }

          # 'widget' is deliberately absent from the loop below: it has its own box above.
          foreach ($n in @('home','goals','history')) {
            $path = "$PWD\shots\$n.png"
            $src = [System.Drawing.Image]::FromFile($path)
            $rect = New-Object System.Drawing.Rectangle 8, 1, 1424, 891
            if ($rect.Right -gt $src.Width -or $rect.Bottom -gt $src.Height) {
              $src.Dispose()
              throw "$n.png is $($src.Width)x$($src.Height), too small for the crop box"
            }
            $dst = New-Object System.Drawing.Bitmap $rect.Width, $rect.Height
            $g = [System.Drawing.Graphics]::FromImage($dst)
            $g.DrawImage($src, (New-Object System.Drawing.Rectangle 0, 0, $rect.Width, $rect.Height), $rect, [System.Drawing.GraphicsUnit]::Pixel)
            $g.Dispose(); $src.Dispose()
            $dst.Save($path, [System.Drawing.Imaging.ImageFormat]::Png)
            $dst.Dispose()
            Write-Host "cropped $n.png to $($rect.Width)x$($rect.Height)"
          }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-store-screenshots
          path: shots/*
