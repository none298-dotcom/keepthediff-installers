name: Verify Linux push notification
on: workflow_dispatch
jobs:
  toast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libnotify-bin dbus-x11 python3-dbus python3-gi
      - name: Send with the app's exact notify-send call and click the default action
        shell: bash
        run: |
          cat > t.sh <<'SH'
          python3 ci-fake-notifyd.py >server.log 2>&1 & sleep 2; gdbus call --session --dest org.freedesktop.Notifications --object-path /org/freedesktop/Notifications --method org.freedesktop.Notifications.GetCapabilities
          printf '#!/bin/sh\necho "$@" > opened.txt\n' > fakeapp; chmod +x fakeapp
          # the exact call and follow-up in LinuxUserScheduler.scriptText
          ACTION=$(timeout 60 notify-send --app-name="Keep the Diff" --action=default=Open --wait 'Please share your feedback' "Anything too complicated about Keep the Diff? I'd love to hear your feedback. Cheers -Lee" 2>err.txt)
          cat err.txt; echo "action=[$ACTION]"
          [ "$ACTION" = default ] && ./fakeapp --open keepthediff://feedback
          cat server.log; cat received.json; echo; cat opened.txt
          grep -q 'keepthediff://feedback' opened.txt && grep -q '"default"' received.json && echo TOAST_CLICK_OK
          kill %1 2>/dev/null; true
          SH
          dbus-run-session -- bash t.sh | tee out.txt
          grep TOAST_CLICK_OK out.txt
