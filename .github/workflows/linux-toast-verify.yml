name: Verify Linux push notification
on: workflow_dispatch
jobs:
  toast:
    runs-on: ubuntu-latest
    steps:
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq dunst libnotify-bin xvfb dbus-x11 scrot imagemagick xdotool
      - name: Post the notification, check it is on screen, click it
        shell: bash
        run: |
          cat > t.sh <<'SH'
          set -u
          Xvfb :99 -screen 0 1280x800x24 >/dev/null 2>&1 & export DISPLAY=:99; sleep 2
          printf '[global]\n    mouse_left_click = do_action, close_current\n' > dunstrc
          dunst -conf dunstrc >/dev/null 2>&1 & sleep 2
          printf '#!/bin/sh\necho "$@" > opened.txt\n' > fakeapp; chmod +x fakeapp
          # the exact notify-send call the app's job script makes
          ( ACTION=$(timeout 120 notify-send --app-name="Keep the Diff" --action=default=Open --wait 'Please share your feedback' "Anything too complicated about Keep the Diff? I'd love to hear your feedback. Cheers -Lee" 2>/dev/null)
            echo "action=[$ACTION]" > action.txt
            [ "$ACTION" = default ] && ./fakeapp --open keepthediff://feedback ) &
          sleep 3
          scrot shot-before.png
          echo "history:"; dunstctl count displayed; dunstctl history | grep -E '"summary"|"appname"' | head
          xdotool mousemove 1100 60 click 1; sleep 3
          sleep 3
          scrot shot-after.png
          cat action.txt opened.txt
          grep -q 'action=\[default\]' action.txt && grep -q 'keepthediff://feedback' opened.txt && echo TOAST_CLICK_OK
          SH
          dbus-run-session -- bash t.sh | tee out.txt
          grep TOAST_CLICK_OK out.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: linux-toast, path: "*.png" }
