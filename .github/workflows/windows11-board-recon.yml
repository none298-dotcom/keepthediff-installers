# What the Windows 11 ARM runner's Widgets Board is made of, so that windows11-board.yml can drive
# it by name instead of by guess. It builds nothing and installs nothing.
#
# WHAT THE RUNS BEFORE THIS ONE ESTABLISHED, each the hard way:
#  35490463982  The image boots parked on the Windows out-of-box privacy page, full screen, over a
#               live desktop with explorer, Widgets.exe and WidgetService.exe running in session 2.
#  35490776224  Nothing presents to the framebuffer: after that page was closed, a full-screen grab
#               still showed it. PrintWindow with PW_RENDERFULLCONTENT against a named window works
#               and is what every screenshot uses now.
#  35490986353  The board opens from shell:AppsFolder\...!Widgets, renders, and its UI Automation
#               rectangles are in the same coordinates as that capture. Win+W does nothing here.
#  35491146383  A pointer press on the board made it vanish.
#  35491583919  The pointer lands exactly where it is sent, the thread is already on the input
#               desktop, and NEITHER mouse_event NOR SendInput closes a plain Win32 dialog's Cancel
#               button. Injected input is dropped in this session. The same button through UI
#               Automation's InvokePattern closed the dialog immediately.
#               Also: the board opens once per job. After it closes, relaunching it does nothing,
#               so the whole sequence has to happen in one step, and the widgets host is restarted
#               first.
name: Windows 11 board recon

on:
  workflow_dispatch:

jobs:
  recon:
    runs-on: windows-11-arm
    timeout-minutes: 25
    env:
      OUT: ${{ github.workspace }}\board-recon
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Open the board, open the picker, and write down what is in them
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          . ./scripts/board.ps1
          Start-Board $env:OUT
          [void](Clear-Intruders)
          Write-Host "widget processes: $((Get-Process Widgets, WidgetService -ErrorAction SilentlyContinue | ForEach-Object { $_.ProcessName }) -join ', ')"
          $route = Open-Board
          "opened via '$route'"
          $board = Get-BoardWindow
          if (-not $board) { throw "The board did not open" }
          Save-WindowShot $board.Handle "board" -Required | Out-Null
          Save-Tree "board" | Out-Null

          $add = @(Find-Elements "Add widgets" | Where-Object { "$($_.Current.ControlType.ProgrammaticName)" -match 'Button' })[0]
          if (-not $add) { throw "No 'Add widgets' button" }
          "the add button: $(Show-Element $add)"
          "pressed through: $(Press-Element $add)"
          Start-Sleep 8

          [Board]::Windows() | Write-Host
          Save-Tree "picker" | Out-Null
          foreach ($w in [Board]::Tops()) {
            if (($w.Rect.Right - $w.Rect.Left) -lt 250 -or ($w.Rect.Bottom - $w.Rect.Top) -lt 250) { continue }
            $name = try { (Get-Process -Id $w.Pid -ErrorAction Stop).ProcessName } catch { "gone" }
            Save-WindowShot $w.Handle "picker-$name-$($w.Handle)" | Out-Null
          }
          foreach ($word in "Add widgets", "Search", "Weather", "Pin", "Esports", "Traffic", "Sports") {
            $hits = @(Find-Elements $word)
            "named like '$word': $($hits.Count)"
            $hits | Select-Object -First 14 | ForEach-Object { "  " + (Show-Element $_) }
          }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: board-recon
          path: board-recon/
