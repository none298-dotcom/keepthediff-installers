# What the Windows 11 ARM runner's Widgets Board is made of, so that windows11-board.yml can drive
# it by name instead of by guess. It builds nothing and installs nothing.
#
# WHAT THE RUNS BEFORE THIS ONE ESTABLISHED, each the hard way:
#  35490463982  The image boots parked on the Windows out-of-box privacy page, full screen, over a
#               live desktop with explorer, Widgets.exe and WidgetService.exe running in session 2.
#  35490776224  Nothing presents to the framebuffer: after that page was closed, a full-screen grab
#               still showed it. PrintWindow with PW_RENDERFULLCONTENT against a named window works
#               and is what every screenshot uses now.
#  35490986353  The board opens from shell:AppsFolder\...!Widgets, renders, and its UI Automation
#               rectangles are in the same coordinates as that capture. Win+W does nothing here.
#  35491146383  A pointer press on the board made it vanish.
#  35491583919  The pointer lands exactly where it is sent, the thread is already on the input
#               desktop, and NEITHER mouse_event NOR SendInput closes a plain Win32 dialog's Cancel
#               button. Injected input is dropped in this session. The same button through UI
#               Automation's InvokePattern closed the dialog immediately.
#               Also: the board opens once per job. After it closes, relaunching it does nothing,
#               so the whole sequence has to happen in one step, and the widgets host is restarted
#               first.
name: Windows 11 board recon

on:
  workflow_dispatch:

jobs:
  recon:
    runs-on: windows-11-arm
    timeout-minutes: 25
    env:
      OUT: ${{ github.workspace }}\board-recon
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: When the board goes, does its window go with it
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          . ./scripts/board.ps1
          Start-Board $env:OUT

          # The board dismisses itself because it never gets the foreground, and it cannot be given
          # it: SetForegroundWindow fails even with the current owner's input queue attached, since
          # this session has never received an input event to hand out. Ending the out-of-box host
          # only moved the foreground to the next shell surface (run 35492905319).
          #
          # So the question changes. A light-dismissed flyout usually HIDES its window rather than
          # destroying it, and the board's content lives in a separate WebView2 top-level window.
          # If either survives, it can still be read and photographed.
          [void](Clear-Intruders)
          $pkg = Get-AppxPackage -Name MicrosoftWindows.Client.WebExperience
          "activate: $([Activator2]::Activate("$($pkg.PackageFamilyName)!Widgets"))"
          Start-Sleep 6

          foreach ($label in "after it has gone") {
            "=== $label: every top-level window, hidden ones included ==="
            foreach ($w in [Board]::Tops($false)) {
              if (($w.Rect.Right - $w.Rect.Left) -lt 200 -or ($w.Rect.Bottom - $w.Rect.Top) -lt 200) { continue }
              $name = try { (Get-Process -Id $w.Pid -ErrorAction Stop).ProcessName } catch { "gone" }
              "  $($w.Handle) $name [$($w.Class)] '$($w.Title)' $($w.Rect.Right - $w.Rect.Left)x$($w.Rect.Bottom - $w.Rect.Top) visible=$($w.Visible)"
            }
          }

          "=== can the hidden ones still be photographed and read ==="
          foreach ($w in [Board]::Tops($false)) {
            if ($w.Class -ne "WindowsDashboard" -and $w.Class -ne "Chrome_WidgetWin_1") { continue }
            if (($w.Rect.Right - $w.Rect.Left) -lt 200) { continue }
            $name = try { (Get-Process -Id $w.Pid -ErrorAction Stop).ProcessName } catch { "gone" }
            "--- $name [$($w.Class)] $($w.Handle), visible=$($w.Visible) ---"
            [void][Board]::ShowWindow($w.Handle, 8)   # SW_SHOWNA: show without activating
            Start-Sleep 2
            Save-WindowShot $w.Handle "hidden-$name-$($w.Handle)" | Out-Null
          }
          Save-Tree "after-dismiss" | Out-Null
          foreach ($word in "Add widgets", "Widgets", "Weather") {
            $hits = @(Find-Elements $word)
            "named like '$word': $($hits.Count)"
            $hits | Select-Object -First 10 | ForEach-Object { "  " + (Show-Element $_) }
          }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: board-recon
          path: board-recon/
