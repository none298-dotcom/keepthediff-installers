# Can the Windows 11 ARM runner's session actually be driven, and does the Widgets Board open?
#
# The earlier probe (windows11-board-probe.yml) found the board's own packages installed on this
# image: MicrosoftWindows.Client.WebExperience and Microsoft.WidgetsPlatformRuntime, with explorer
# running and a 1024x768 virtual screen. This asks the next questions, which are the ones that
# decide whether the widgets can be seen: does the screen compose, does synthetic input reach the
# shell, does Win+W open the board, and what does the board's UI Automation tree call things.
#
# WHAT THE FIRST RUN FOUND (35490463982): every screenshot after the first was byte for byte
# identical, because the image boots parked on the Windows out-of-box privacy page, full screen,
# over a live desktop. Widgets.exe and WidgetService.exe were already running in session 2. So the
# session is real and the only thing wrong was what was in front of it, which scripts/board.ps1
# closes now.
#
# It builds nothing. It exists to be read so that the real workflow clicks named elements instead
# of guessed coordinates.
name: Windows 11 board recon

on:
  workflow_dispatch:

jobs:
  recon:
    runs-on: windows-11-arm
    timeout-minutes: 25
    env:
      OUT: ${{ github.workspace }}\board-recon
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Clear the desktop and prove input reaches the shell
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          . ./scripts/board.ps1
          Start-Board $env:OUT
          Write-Host "--- what is on screen before anything is touched ---"
          [Board]::Windows() | Write-Host
          Save-Shot "as-the-runner-hands-it-over" | Out-Null
          [void](Clear-Intruders)
          Assert-Screen
          Save-Shot "desktop" | Out-Null
          Save-Tree "desktop" | Out-Null

          # The Start menu is the cheapest proof that a synthetic Win key reaches the shell. If this
          # does not open, nothing below is a statement about the Widgets Board.
          Send-Key $VK_LWIN
          Start-Sleep 5
          Save-Shot "after-win-key" | Out-Null
          $start = @([Board]::Tops() | Where-Object { $_.Class -eq "Windows.UI.Core.CoreWindow" })
          "CoreWindows on screen after the Win key: $($start.Count)"
          $start | ForEach-Object { "  [$($_.Class)] '$($_.Title)' pid $($_.Pid)" }
          Send-Key $VK_ESCAPE
          Start-Sleep 3

      - name: Open the board and try every way of photographing it
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          . ./scripts/board.ps1
          Start-Board $env:OUT
          $script:BoardShot = 10
          [void](Clear-Intruders)
          $route = Open-Board 60
          "the board opened via: '$route'"
          Start-Sleep 12
          [Board]::Windows() | Write-Host

          # Every window worth a picture, through both PrintWindow modes and through the screen, so
          # the next workflow can use whichever one actually draws.
          foreach ($w in [Board]::Tops()) {
            $wide = $w.Rect.Right - $w.Rect.Left; $high = $w.Rect.Bottom - $w.Rect.Top
            if ($wide -lt 300 -or $high -lt 300) { continue }
            $name = try { (Get-Process -Id $w.Pid -ErrorAction Stop).ProcessName } catch { "gone" }
            foreach ($flags in 0, 2) {
              $bmp = Get-WindowImage $w.Handle $flags
              if (-not $bmp) { "PrintWindow($flags) refused $name [$($w.Class)]"; continue }
              $colours = Measure-Colours $bmp
              $file = Join-Path $env:OUT ("pw{0}-{1}-{2}.png" -f $flags, $name, $w.Handle)
              $bmp.Save($file, [System.Drawing.Imaging.ImageFormat]::Png)
              "PrintWindow($flags) $name [$($w.Class)] $($bmp.Width)x$($bmp.Height): $colours colours -> $(Split-Path $file -Leaf)"
              $bmp.Dispose()
            }
          }
          Save-Shot "screen-for-comparison" | Out-Null
          Save-Tree "board" | Out-Null
          foreach ($word in "Widget", "Add", "Keep the Diff", "Weather", "Pin", "Sign in", "Edit") {
            $hits = @(Find-Elements $word)
            "named like '$word': $($hits.Count)"
            $hits | Select-Object -First 12 | ForEach-Object { "  " + (Show-Element $_) }
          }
          if (-not $route) { Write-Host "::warning::The board did not open by either route" }

      # The run before this one clicked the board's add button and the board VANISHED: no picker, no
      # dashboard window, nothing. Two explanations fit, and they need different fixes, so both are
      # measured here. Either the pointer never went where it was sent and the press landed on the
      # transparent margin, which light-dismisses the board; or the board dismisses on any synthetic
      # press and the accessibility API is the only way in.
      - name: Where does the pointer actually go
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"
          . ./scripts/board.ps1
          Start-Board $env:OUT
          $script:BoardShot = 30
          # A plain Win32 dialog is the control: if its Cancel button closes it, the pointer works
          # and anything the board does differently is the board's own behaviour.
          $dialog = [Board]::Tops() | Where-Object { $_.Title -eq "Performance Options" } | Select-Object -First 1
          if ($dialog) {
            $cancel = Find-Elements "Cancel" | Select-Object -First 1
            if ($cancel) {
              "control: $(Show-Element $cancel)"
              Click-Element $cancel
              $still = [Board]::Tops() | Where-Object { $_.Handle -eq $dialog.Handle }
              "after the click the dialog is $(if ($still) { 'STILL OPEN: the pointer does not work' } else { 'closed: the pointer works' })"
            }
          } else { "no Performance Options dialog to use as a control" }

      - name: Open the picker through the accessibility API instead
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          . ./scripts/board.ps1
          Start-Board $env:OUT
          $script:BoardShot = 40
          [void](Clear-Intruders)
          $route = Open-Board 60
          "opened via '$route'"
          $board = Get-BoardWindow
          if (-not $board) { throw "The board is not open" }
          Save-WindowShot $board.Handle "board-before" | Out-Null

          $add = @(Find-Elements "Add widgets" | Where-Object { $_.Current.ControlType.ProgrammaticName -match 'Button' }) | Select-Object -First 1
          if (-not $add) { throw "No 'Add widgets' button in the board" }
          "the add button: $(Show-Element $add)"
          $how = Press-Element $add
          "pressed it through: $how"

          for ($i = 1; $i -le 8; $i++) {
            Start-Sleep 3
            $tops = @([Board]::Tops() | Where-Object { ($_.Rect.Right - $_.Rect.Left) -gt 300 -and ($_.Rect.Bottom - $_.Rect.Top) -gt 300 })
            "t+$($i * 3)s: $(($tops | ForEach-Object { "[$($_.Class)]$($_.Title)" }) -join '  ')"
          }
          Save-Tree "picker" | Out-Null
          foreach ($w in [Board]::Tops()) {
            if (($w.Rect.Right - $w.Rect.Left) -lt 300 -or ($w.Rect.Bottom - $w.Rect.Top) -lt 300) { continue }
            $name = try { (Get-Process -Id $w.Pid -ErrorAction Stop).ProcessName } catch { "gone" }
            Save-WindowShot $w.Handle "window-$name-$($w.Handle)" | Out-Null
          }
          foreach ($word in "Add widgets", "Search", "Keep the Diff", "Weather", "Pin") {
            $hits = @(Find-Elements $word)
            "named like '$word': $($hits.Count)"
            $hits | Select-Object -First 14 | ForEach-Object { "  " + (Show-Element $_) }
          }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: board-recon
          path: board-recon/
